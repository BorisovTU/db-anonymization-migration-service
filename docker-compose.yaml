services:
  postgres-source:
    image: postgres:17-alpine
    container_name: postgres-source
    environment:
      POSTGRES_DB: source_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_source_pwd
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-source-db.sql:/docker-entrypoint-initdb.d/init-source-db.sql:ro
      - ./docker/seed-data:/docker-entrypoint-initdb.d/seed-data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d source_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-target:
    image: postgres:17-alpine
    container_name: postgres-target
    environment:
      POSTGRES_DB: target_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_target_pwd
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d target_db"]
      interval: 5s
      timeout: 5s
      retries: 5

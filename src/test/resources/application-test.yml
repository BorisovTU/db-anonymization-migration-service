spring:
 application:
 name: db-anonymization-migration-test
 liquibase:
 enabled: true
 change-log: classpath:db/changelog/db.changelog-master.xml
anonymization:
 salt: test-crypto-secret-salt-152fz
 batch-size: 2
 concurrency-limit: 4
 email-domain: test-anonymized.local
 tables:
 - table-name: customer_profiles
 id-column: id
 id-type: UUID
 columns:
 - column-name: full_name
 strategy: FULL_NAME
 - column-name: phone_number
 strategy: PHONE
 - column-name: email
 strategy: EMAIL
 - table-name: customer_attachments
 id-column: id
 id-type: BIGINT
 columns:
 - column-name: customer_id
 strategy: UUID_FK
 - column-name: file_storage_path
 strategy: FILE_PATH
logging:
 level:
 ru.architect.migration: DEBUG
